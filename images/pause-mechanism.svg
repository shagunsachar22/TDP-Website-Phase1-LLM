<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">The Deliberate Pause mechanism</title>
  <desc id="desc">An abstract diagram showing stimulus, pause, and response through mind, breath, and body.</desc>
  <defs>
    <radialGradient id="paperGlow" cx="50%" cy="48%" r="62%">
      <stop offset="0%" stop-color="#FFF8E8"/>
      <stop offset="47%" stop-color="#EFE3D1"/>
      <stop offset="100%" stop-color="#C6B69B"/>
    </radialGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F2D3A6" stop-opacity="0.95"/>
      <stop offset="48%" stop-color="#E4D0AE" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#E4D0AE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="clayWash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B87556" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6A4E40" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="taupeWash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A8372" stop-opacity="0.58"/>
      <stop offset="100%" stop-color="#332A24" stop-opacity="0.68"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#332A24" flood-opacity="0.18"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.08"/>
      </feComponentTransfer>
    </filter>
    <style>
      @keyframes pausePulse {
        0%, 100% { opacity: 0.48; transform: scale(0.96); }
        50% { opacity: 0.95; transform: scale(1.04); }
      }
      .pause-pulse {
        animation: pausePulse 2.8s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
    </style>
  </defs>
  <rect width="1600" height="1200" fill="url(#paperGlow)"/>
  <rect width="1600" height="1200" filter="url(#grain)" opacity="0.42"/>
  <path d="M0 736C210 606 360 784 530 704C662 642 730 528 854 564C1034 616 1088 816 1280 682C1402 597 1505 583 1600 622V1200H0Z" fill="#8A8372" opacity="0.18"/>
  <path d="M0 866C232 704 390 900 602 770C735 689 846 706 984 806C1128 910 1344 764 1600 808V1200H0Z" fill="#6A4E40" opacity="0.13"/>
  <g opacity="0.5" fill="none" stroke="#FFFFF6" stroke-width="2">
    <circle cx="800" cy="600" r="402"/>
    <circle cx="800" cy="600" r="324"/>
    <circle cx="800" cy="600" r="230"/>
  </g>
  <circle cx="800" cy="600" r="200" fill="url(#centerGlow)"/>
  <g fill="none" stroke="#B87556" stroke-width="2.6" opacity="0.74">
    <circle cx="800" cy="600" r="276"/>
    <path d="M524 600c0-153 123-276 276-276"/>
    <path d="M1076 600c0 153-123 276-276 276"/>
  </g>
  <g filter="url(#softShadow)">
    <circle cx="800" cy="276" r="128" fill="#8A8372" opacity="0.86"/>
    <circle cx="444" cy="758" r="142" fill="url(#clayWash)"/>
    <circle cx="1156" cy="758" r="142" fill="url(#taupeWash)"/>
  </g>
  <g fill="none" stroke="#FFF8E8" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(800 276)" opacity="0.86">
      <path d="M-66 2c-18-34 8-72 44-62 9-25 48-25 58 0 35-8 60 30 42 62 24 22 10 64-24 66-16 31-57 28-70 0-33 7-60-25-49-58" stroke-width="4.4"/>
      <path d="M-22-60c-2 30 1 56 16 78M35-60c-6 28-3 55 13 82" stroke-width="2.8" opacity="0.62"/>
      <g class="pause-pulse">
        <path d="M-15 12v44M18 12v44" stroke-width="8"/>
        <circle cx="1" cy="-22" r="8" fill="#FFF8E8" stroke="none"/>
      </g>
      <path d="M-82 78c44 22 116 22 160 0" stroke-width="2.2" opacity="0.42"/>
    </g>
    <g transform="translate(444 758)" opacity="0.88">
      <path d="M-118 0H40" stroke-width="5.2"/>
      <path d="M20-22 48 0 20 22" stroke-width="5.2"/>
      <circle cx="76" cy="0" r="24" stroke-width="4.2"/>
      <circle cx="76" cy="0" r="7" fill="#FFF8E8" stroke="none"/>
      <path d="M-116-52c34-22 74-22 108 0M-116 52c34 22 74 22 108 0" stroke-width="3.2" opacity="0.64"/>
      <path d="M-128-82c48-34 104-34 152 0M-128 82c48 34 104 34 152 0" stroke-width="2.2" opacity="0.36"/>
    </g>
    <g transform="translate(1156 758)" opacity="0.84">
      <circle cx="-70" cy="0" r="24" stroke-width="4.2"/>
      <circle cx="-70" cy="0" r="7" fill="#FFF8E8" stroke="none"/>
      <path d="M-42 0H116" stroke-width="5.2"/>
      <path d="M90-22 118 0 90 22" stroke-width="5.2"/>
      <path d="M18-52c34-22 74-22 108 0M18 52c34 22 74 22 108 0" stroke-width="3.2" opacity="0.64"/>
      <path d="M-6-82c48-34 104-34 152 0M-6 82c48 34 104 34 152 0" stroke-width="2.2" opacity="0.36"/>
    </g>
  </g>
  <g fill="#B87556">
    <circle cx="800" cy="390" r="12"/>
    <circle cx="524" cy="600" r="10"/>
    <circle cx="1076" cy="600" r="10"/>
    <circle cx="800" cy="876" r="8"/>
  </g>
  <g fill="none" stroke="#B87556" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 16" opacity="0.58">
    <path d="M680 340C590 374 536 442 524 600"/>
    <path d="M920 340c90 34 144 102 156 260"/>
    <path d="M520 758c106 76 448 76 560 0"/>
  </g>
</svg>
